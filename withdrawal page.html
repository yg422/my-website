<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal page</title>
    <link rel="stylesheet" href="withdrawal page.css"> 
</head>
<body>
  <main>
    <h1>Withdraw money</h1>
    <p class="intro">Choose where you’d like to receive your funds.</p>

    <section class="balance">
      <span>Available demo wallet balance</span>
      <strong id="withdrawal-balance">$12,450.00</strong>
    </section>

    <form id="withdrawal-form">
      <h2>Choose withdrawal method </h2>
      <p class="hint">Choose a method and amount. This records a demo withdrawal only; it does not send money.</p>

      <div class="methods" role="radiogroup" aria-label="Payout method">
        <label class="method">
          <input type="radio" name="method" value="bank" checked>
          <strong>Bank transfer (demo)</strong><small>No real payout</small>
        </label>
        <label class="method">
          <input type="radio" name="method" value="paypal">
          <strong>PayPal (demo)</strong><small>No real payout</small>
        </label>
        <label class="method">
          <input type="radio" name="method" value="crypto">
          <strong>Crypto (demo)</strong><small>No real payout</small>
        </label>
      </div>

      <div class="fields">
        <div class="field full">
          <label for="amount">Withdrawal amount (USD)</label>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01"
                 placeholder="0.00" required>
        </div>
      </div>

      <button type="submit">Continue withdrawal →</button>
      <p id="notice" role="status"></p>
    </form>
  </main>
  <script type="module">
    import { requireSignedIn, loadWallet, withdrawDemoFunds, money } from './demo-wallet.js'
    const user = await requireSignedIn()
    const form = document.querySelector('#withdrawal-form')
    const notice = document.querySelector('#notice')
    const balanceDisplay = document.querySelector('#withdrawal-balance')
    if (user) {
      try {
        const wallet = await loadWallet()
        balanceDisplay.textContent = money.format(wallet.balance)
      } catch (error) {
        notice.textContent = error.message
        notice.classList.add('show')
      }
      form.addEventListener('submit', (event) => {
        event.preventDefault()
        const amount = Number(document.querySelector('#amount').value)
        const method = document.querySelector('input[name="method"]:checked').value
        if (!Number.isFinite(amount) || amount <= 0) {
          notice.textContent = 'Enter an amount greater than zero.'
          notice.classList.add('show')
          return
        }
        if (!window.confirm(`Record a demo withdrawal of ${money.format(amount)} by ${method}?`)) return
        const submit = form.querySelector('button[type="submit"]')
        submit.disabled = true
        withdrawDemoFunds(amount, method).then((newBalance) => {
          balanceDisplay.textContent = money.format(newBalance)
          notice.textContent = `Demo withdrawal recorded. New balance: ${money.format(newBalance)}.`
          notice.classList.add('show')
          form.reset()
        }).catch((error) => {
          notice.textContent = error.message
          notice.classList.add('show')
        }).finally(() => {
          submit.disabled = false
        })
      })
    }
  </script>
</body>
</html>
