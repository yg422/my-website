<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html"><span>●</span> YG-PAY</a>
        <a class="logout" id="logout-link" href="contact=styled.html">Log out</a>
    </header>

    <main>
        <section class="welcome">
            <p>Your account overview</p>
            <h1>Welcome, <span id="userName">Cole Hauser</span></h1>  
        </section>

        <section class="top-grid">
            <div class="card balance-card">
                <p class="balance-label">Available balance</p> 
            <h2 class="balance-amount" id="balance">Loading…</h2>
            <p class="balance-note">Available balance</p>
            </div>
        </section>
        <h3> Quick actions</h3>
        <div class="container">
            <div class="box">
                <!-- <button class="action-button secondary" onclick="withdrawMoney()">Withdraw</button> -->
                 <button class="quick-action-button" onclick="window.location.href='withdrawal page.html'"><span class="action-icon" aria-hidden="true">↓</span>Withdraw</button>
            </div>
            <div class="box">
                <!-- <button class="action-button" onclick="transferMoney()"> Send </button>  -->
                <button class="quick-action-button" onclick="window.location.href='send page. html.html'"><span class="action-icon" aria-hidden="true">➤</span>Send</button>
            </div>
            <div class="box">
                <button class="quick-action-button" onclick=""><span class="action-icon" aria-hidden="true">＋</span>Request</button>
            </div>
        </div>

        <section class="card history-card"> 
            <div class="history-heading">
                <h2>Transaction history</h2>
                <span>Recent activity</span>
            </div>
            <div id="transactions"></div>
            <button id="view-all-transactions" class="view-all-transactions" type="button" hidden>View all</button>
        </section>
    </main>

    <script type="module">
        import { supabase, requireSignedIn, loadWallet, money, renderTransactions } from './demo-wallet.js'

        const user = await requireSignedIn()
        if (user) {
            document.querySelector('#userName').textContent = user.user_metadata?.full_name || user.email
            try {
                const wallet = await loadWallet()
                document.querySelector('#balance').textContent = money.format(wallet.balance)
                const transactionList = document.querySelector('#transactions')
                const viewAllButton = document.querySelector('#view-all-transactions')
                let showingAllTransactions = false
                const updateTransactionList = () => {
                    renderTransactions(
                        showingAllTransactions ? wallet.transactions : wallet.transactions.slice(0, 5),
                        transactionList
                    )
                    viewAllButton.hidden = wallet.transactions.length <= 5
                    viewAllButton.textContent = showingAllTransactions ? 'Show less' : 'View all'
                    viewAllButton.setAttribute('aria-expanded', String(showingAllTransactions))
                }
                updateTransactionList()
                viewAllButton.addEventListener('click', () => {
                    showingAllTransactions = !showingAllTransactions
                    updateTransactionList()
                })
            } catch (error) {
                document.querySelector('#transactions').textContent = error.message
            }
        }

        document.querySelector('#logout-link').addEventListener('click', async (event) => {
            event.preventDefault()
            await supabase.auth.signOut()
            window.location.assign('contact=styled.html')
        })
    </script>
</body>
</html>
