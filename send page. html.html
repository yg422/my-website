<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Page</title>
    <link rel="stylesheet" href="send.css">   
</head>
<body>
    <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">Y</span>YG-PAY</div>
    <a href="homepage.html">Back</a>
    <p class="eyebrow">Payments</p>
    <h1>Send money</h1>
    <p class="intro">Enter the recipient and payment details below.</p>

    <form id="send-form">
      <div class="field">
        <label for="recipient-email">Recipient email</label>
        <input id="recipient-email" name="recipient_email" type="email" placeholder="name@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <div class="amount-wrap">
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required>
          <span class="currency" aria-hidden="true">USD</span>
        </div>
      </div>
      <button type="submit">Continue</button>
      <p class="secure">Transactions update app balances only.</p>
      <p id="notice" role="status" aria-live="polite"></p>
    </form>
  </main>
  <dialog id="transfer-receipt" class="receipt-dialog" aria-labelledby="receipt-title">
    <div class="receipt-check" aria-hidden="true">✓</div>
    <p class="receipt-status">Payment successful</p>
    <h2 id="receipt-title">Transfer complete</h2>
    <p class="receipt-amount" id="receipt-amount"></p>
    <div class="receipt-details">
      <div><span>Sent to</span><strong id="receipt-recipient"></strong></div>
      <div><span>Date</span><strong id="receipt-date"></strong></div>
      <div><span>Status</span><strong class="receipt-complete">Complete</strong></div>
    </div>
    <button class="receipt-done" id="receipt-done" type="button">Done</button>
  </dialog>
  <script type="module">
    import { requireSignedIn, sendDemoTransfer, money } from './demo-wallet.js'
    const user = await requireSignedIn()
    const form = document.querySelector('#send-form')
    const notice = document.querySelector('#notice')
    const receipt = document.querySelector('#transfer-receipt')
    let sending = false
    if (user) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        if (sending) return
        const amount = Number(document.querySelector('#amount').value)
        const recipient = document.querySelector('#recipient-email').value.trim()
        if (!Number.isFinite(amount) || amount <= 0) {
          notice.textContent = 'Enter an amount greater than zero.'
          return
        }
        const submit = form.querySelector('button[type="submit"]')
        sending = true
        submit.disabled = true
        notice.textContent = 'Sending…'
        try {
          const result = await sendDemoTransfer(recipient, amount)
          notice.textContent = ''
          document.querySelector('#receipt-amount').textContent = money.format(amount)
          document.querySelector('#receipt-recipient').textContent = result.recipientName
          document.querySelector('#receipt-date').textContent = new Date().toLocaleString()
          receipt.showModal()
          form.reset()
        } catch (error) {
          notice.textContent = error.message
        } finally {
          sending = false
          submit.disabled = false
        }
      })
    }
    document.querySelector('#receipt-done').addEventListener('click', () => receipt.close())
  </script>
</body>
</html>
